services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: diligencia
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    ports: ["5440:5432"]  # 5432 já usada por outro projeto nesta máquina
    volumes: ["pgdata:/var/lib/postgresql/data"]

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: secret
    ports: ["5672:5672", "15672:15672"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  pgdata: